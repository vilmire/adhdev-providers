name: Validate CLI providers

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'schemas/v1/cli/**'
      - 'scripts/validate-cli-schema.mjs'
      - 'scripts/validate-provider-schema.mjs'
      - '.github/workflows/validate-cli.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'schemas/v1/cli/**'
      - 'scripts/validate-cli-schema.mjs'
      - 'scripts/validate-provider-schema.mjs'
      - '.github/workflows/validate-cli.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # We need the oss/ submodule for the ajv dependency the validator loads.
          # adhdev-providers is itself a submodule of adhdev-cloud; for now we
          # bootstrap a minimal install on top.
          submodules: false

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install ajv (minimal, isolated)
        run: npm install --prefix ci-deps --no-package-lock ajv@^8.17.1 ajv-formats@^3.0.1 > /dev/null

      # This step used to carry an inline `node -e` copy of the validator. That
      # copy had drifted: it looked only for the v0 `cli/<name>/provider.json`,
      # but every CLI provider migrated to `provider.v1.json`, so it iterated 8
      # directories, `continue`d on all 8, and reported `Failed: 0` while
      # validating nothing. scripts/validate-cli-schema.mjs is the maintained
      # implementation — it prefers v1 with a v0 fallback, fails closed on an
      # empty target set, and asserts the production providers are present.
      # Call it instead of re-implementing it here.
      - name: Validate all CLI provider manifests
        run: node scripts/validate-cli-schema.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/ci-deps/node_modules
