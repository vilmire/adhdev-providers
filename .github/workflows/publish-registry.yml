name: Publish to Registry

# Publishes provider artifacts to the registry on the PREVIEW channel only.
# stable is promotion-only server-side (REGISTRY_STABLE_PUBLISH_FORBIDDEN);
# promote preview -> stable separately. Any rejected publish fails the job.
#
# Prod and preview are separate registries (separate DB and keys). Targets:
#   preview  https://api-preview.adhf.dev  token secret ADHDEV_PUBLISH_TOKEN_PREVIEW
#   prod     https://api.adhf.dev          token secret ADHDEV_PUBLISH_TOKEN
# Repository secrets: ADHDEV_PUBLISH_TOKEN_PREVIEW, ADHDEV_PUBLISH_TOKEN.
# A target whose secret is missing is skipped with a ::warning::; if every
# target is skipped the job fails.
# Optional repository variable ADHDEV_REGISTRY_TARGETS overrides the target
# list: JSON array of {"name","url","tokenEnv"} where tokenEnv is one of the
# secrets above. url is an origin (or origin/api/v1[/registry]).

on:
  push:
    branches: [main]
    paths:
      # Whole artifact trees, not just the manifests: the published
      # bundleDigest covers every git-tracked file under <category>/<dir>, so
      # a fixtures/scripts/specs change also moves the digest. Triggering only
      # on provider*.json let the registry digest drift stale against the
      # transport tarball — the daemon then refused activation with
      # DIGEST_MISMATCH and the provider silently froze (kimi, 2026-08).
      - 'cli/**'
      - 'ide/**'
      - 'extension/**'

  # Allow manual trigger for backfills
  workflow_dispatch:
    inputs:
      provider_type:
        description: 'Provider type to publish (e.g. claude-cli). Leave empty to publish all.'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          # Full history: sourceCommit pin = newest commit touching each provider dir.
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install ajv for schema validation
        run: npm install --prefix ci-deps --no-package-lock ajv@^8.17.1 ajv-formats@^3.0.1 > /dev/null

      - name: Publish providers to registry (preview channel)
        env:
          ADHDEV_REGISTRY_TARGETS: ${{ vars.ADHDEV_REGISTRY_TARGETS }}
          ADHDEV_PUBLISH_TOKEN: ${{ secrets.ADHDEV_PUBLISH_TOKEN }}
          ADHDEV_PUBLISH_TOKEN_PREVIEW: ${{ secrets.ADHDEV_PUBLISH_TOKEN_PREVIEW }}
          AJV_DIR: ${{ github.workspace }}/ci-deps/node_modules
          FILTER_TYPE: ${{ inputs.provider_type }}
        run: node scripts/publish-registry.mjs
