# Legacy / supplemental workflow.
# The canonical provider registry is served from the API (publish-registry.yml → api.adhf.dev/api/v1/registry).
# This workflow regenerates the flat registry.json file in the repo root for backwards compatibility
# (tools that read registry.json directly from the repo). The file is written as a plain artifact —
# no auto-commit or push. If the generated output changes it will show up as an unstaged diff and
# can be committed as part of a normal PR.
name: Generate Registry
on:
  push:
    branches: [main]
    paths:
      - '**/provider.json'
      - '**/scripts.js'

jobs:
  generate-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate registry.json
        run: |
          python3 -c "
          import json, glob

          registry = {'version': '$(date +%Y.%m.%d)', 'providers': {}}

          for pj in sorted(glob.glob('**/provider.json', recursive=True)):
              parts = pj.split('/')
              # Skip version subdirs (1.107/, 0.48/ etc)
              if any(p[0].isdigit() and '.' in p for p in parts):
                  continue
              if 'legacy' in parts:
                  continue
              try:
                  with open(pj) as f:
                      d = json.load(f)
                  if 'type' not in d or 'category' not in d:
                      continue
                  entry = {
                      'providerVersion': d.get('providerVersion', '0.0.0'),
                      'category': d['category'],
                      'name': d.get('name', d['type']),
                      'status': d.get('status', 'Stable'),
                      'details': d.get('details', 'Agent Client Protocol (ACP)' if d['category'] == 'acp' else 'Community Provider')
                  }
                  if d.get('compatibility'):
                      entry['compatibility'] = d['compatibility']
                  registry['providers'][d['type']] = entry
              except: pass

          with open('registry.json', 'w') as f:
              json.dump(registry, f, indent=2, ensure_ascii=False)
          print(f'Generated registry.json with {len(registry[\"providers\"])} providers')
          "
